name: Publish Determined vLLM image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TARGET_IMAGE: ghcr.io/jiaobin-1/toolspiral-vllm:0.8.5.post1-bfcl-det

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish the evaluation runtime
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false \
            --tag "$TARGET_IMAGE" \
            --push \
            .

      - name: Verify published image metadata
        run: |
          docker buildx imagetools inspect "$TARGET_IMAGE"
          digest="$(docker buildx imagetools inspect "$TARGET_IMAGE" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          test -n "$digest"
          echo "PUBLISHED_IMAGE=$TARGET_IMAGE@$digest"
          echo "Published \`$TARGET_IMAGE@$digest\`" >> "$GITHUB_STEP_SUMMARY"
